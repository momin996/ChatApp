<div class="row" *ngIf="user$ | async as user">
    <div class="col-lg-4 col-xxl-3">
        <app-chat-sidebar *ngIf="chatList$ | async as chatList" [chatList]="chatList"></app-chat-sidebar>
    </div>
    <div class="col-lg-8 col-xxl-9">
        <app-conversation *ngIf="conversation$ | async as conversation" [user]="user" [conversation]="conversation"></app-conversation>
    </div>
</div>
